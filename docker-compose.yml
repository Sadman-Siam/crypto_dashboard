services:
  backend:
    build: ./backend
    container_name: crypto_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT: 5000
      - CMC_PRO_API_KEY=${CMC_PRO_API_KEY}
      - CMC_PRO_API_URL=${CMC_PRO_API_URL}

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000/api
    container_name: crypto_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
